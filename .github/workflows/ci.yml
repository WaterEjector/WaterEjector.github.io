name: CI Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run E2E & Quality Tests
        shell: bash
        run: |
          python - << 'EOF'
          import os
          import re
          import json
          import sys
          import xml.etree.ElementTree as ET

          errors = 0
          print("=" * 60)
          print("GITHUB ACTIONS CI: RUNNING E2E VALIDATION SUITE")
          print("=" * 60)

          # 1. Check Root Required Files
          required_files = [
              "index.html", "style.css", "script.js",
              "ads.txt", "app-ads.txt", "robots.txt", "sitemap.xml",
              "favicon.ico", "icon.svg", "icon-192.png", "icon-512.png",
              "manifest.json", "sw.js"
          ]
          for rf in required_files:
              if not os.path.exists(rf):
                  print(f"[ERROR] Missing required file: {rf}")
                  errors += 1
              else:
                  print(f" [OK] File present: {rf}")

          # 2. Check HTML Pages
          html_pages = []
          for root, dirs, files in os.walk('.'):
              if '.git' in root or 'components' in root:
                  continue
              for f in files:
                  if f.endswith('.html') and not f.startswith('google'):
                      html_pages.append(os.path.join(root, f))

          print(f"\nChecking {len(html_pages)} HTML pages...")
          for page in html_pages:
              with open(page, 'r', encoding='utf-8') as f:
                  content = f.read()

              # Check Title
              if not re.search(r'<title>.*?</title>', content):
                  print(f"[ERROR] Missing <title> in {page}")
                  errors += 1

              # Check Meta Description
              if not re.search(r'<meta\s+name=["\']description["\']', content, re.I):
                  print(f"[ERROR] Missing meta description in {page}")
                  errors += 1

              # Check H1 Count
              h1_count = len(re.findall(r'<h1[^>]*>.*?</h1>', content, re.I | re.S))
              if h1_count != 1:
                  print(f"[ERROR] Found {h1_count} <h1> tags in {page} (expected exactly 1)")
                  errors += 1

              # Check Canonical Link
              if not re.search(r'<link\s+rel=["\']canonical["\']', content):
                  print(f"[ERROR] Missing canonical link in {page}")
                  errors += 1

              # Check Header & Footer placeholders
              if '<div id="header-placeholder"></div>' not in content:
                  print(f"[ERROR] Missing header placeholder in {page}")
                  errors += 1
              if '<div id="footer-placeholder"></div>' not in content:
                  print(f"[ERROR] Missing footer placeholder in {page}")
                  errors += 1

              # Check Manifest Link
              if '<link rel="manifest" href="/manifest.json">' not in content:
                  print(f"[ERROR] Missing manifest link in {page}")
                  errors += 1

          # 3. Check Components
          header_p = os.path.join("components", "header.html")
          footer_p = os.path.join("components", "footer.html")
          if not os.path.exists(header_p):
              print("[ERROR] components/header.html missing!")
              errors += 1
          if not os.path.exists(footer_p):
              print("[ERROR] components/footer.html missing!")
              errors += 1
          else:
              with open(footer_p, 'r', encoding='utf-8') as f:
                  fc = f.read()
              if "https://www.devdeskapp.com/" not in fc:
                  print("[ERROR] DevDeskApp backlink missing in footer.html!")
                  errors += 1

          # 4. Check Sitemap.xml
          try:
              tree = ET.parse("sitemap.xml")
              root = tree.getroot()
              ns = {'ns': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
              urls = root.findall('.//ns:loc', ns) or root.findall('.//loc')
              if len(urls) != 12:
                  print(f"[ERROR] Expected 12 URLs in sitemap, found {len(urls)}")
                  errors += 1
              else:
                  print(f" [OK] Sitemap verified with {len(urls)} registered URLs")
          except Exception as e:
              print(f"[ERROR] Sitemap invalid XML: {e}")
              errors += 1

          # 5. Check manifest.json
          try:
              with open("manifest.json", 'r', encoding='utf-8') as f:
                  m = json.load(f)
              if "icons" not in m or len(m["icons"]) < 2:
                  print("[ERROR] Manifest icons missing or incomplete")
                  errors += 1
              else:
                  print(f" [OK] Manifest verified with {len(m['icons'])} icons")
          except Exception as e:
              print(f"[ERROR] Manifest invalid JSON: {e}")
              errors += 1

          # 6. Check ads.txt
          if os.path.exists("ads.txt"):
              with open("ads.txt", 'r', encoding='utf-8') as f:
                  ac = f.read().strip()
              if "pub-2136229145694242" in ac:
                  print(" [OK] ads.txt verified")
              else:
                  print("[ERROR] ads.txt invalid publisher ID")
                  errors += 1

          print("\n" + "=" * 60)
          print(f"CI VALIDATION SUMMARY: Errors: {errors}")
          print("=" * 60)
          if errors > 0:
              sys.exit(1)
          print("ALL CI TESTS PASSED SUCCESSFULLY! (SUCCESS)")
          EOF
